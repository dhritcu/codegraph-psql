name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    env:
      CODEGRAPH_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Not 22.12 or 22.13: node:sqlite is unflagged from 22.13, but that build's
          # SQLite has no FTS5 ("no such module: fts5"), which every DB test needs.
          node-version: '22.23'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
